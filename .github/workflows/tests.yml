name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 cmake g++
          # jolt's own install script owns the archive naming and verifies
          # the checksum; see glimmer-gtk's workflow for why not by hand.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Build the FTXUI shim
        # fetches FTXUI at the pinned commit and links it in statically
        run: JOLT_PWD="$PWD" jolt native
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
